<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Engineering Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 { margin-top: 0; text-align: center; }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      cursor: pointer;
      border-bottom: 2px solid #ddd;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      color: #777;
    }
    .tab.active {
      color: #007bff;
      border-bottom: 2px solid #007bff;
      margin-bottom: -2px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label { display: block; margin-bottom: 5px; font-size: 14px; }
    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button#submit-btn {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button#submit-btn:disabled { background-color: #a0c4ff; }
    #message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
    }
    .error { color: red; }
    .ok { color: green; }
    .signout {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card" id="form-card">
    <div class="tabs">
      <div id="tab-signup" class="tab active">Sign Up</div>
      <div id="tab-login" class="tab">Log In</div>
    </div>

    <h2 id="heading">Sign in to comment</h2>

    <form id="auth-form">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="new-password">
      </div>
      <button type="submit" id="submit-btn">Sign up</button>
    </form>
    
    <div id="message"></div>
  </div>

  <div class="card" id="status-card" style="display: none;">
    <h2>Status</h2>
    <div id="status-content"></div>
  </div>

  <!-- Firebase v8 SDK Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script>
    // Your actual Firebase project configuration for "Engineering Hub"
    const firebaseConfig = {
      apiKey: "AIzaSy... (your actual key from console) ...",
      authDomain: "engineering-hub-2e9a6.firebaseapp.com",
      projectId: "engineering-hub-2e9a6",
      storageBucket: "engineering-hub-2e9a6.appspot.com",
      messagingSenderId: "207771035782",
      appId: "1:207771035782:web:7b6ac40533b71c982fc907"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const form = document.getElementById("auth-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submit-btn");
    const messageEl = document.getElementById("message");
    const formCard = document.getElementById("form-card");
    const statusCard = document.getElementById("status-card");
    const statusContent = document.getElementById("status-content");
    const heading = document.getElementById("heading");
    const tabSignup = document.getElementById("tab-signup");
    const tabLogin = document.getElementById("tab-login");

    let mode = "signup";

    function setMode(newMode) {
      mode = newMode;
      tabSignup.classList.toggle("active", mode === "signup");
      tabLogin.classList.toggle("active", mode === "login");
      submitBtn.textContent = mode === "signup" ? "Sign up" : "Log in";
      passwordInput.setAttribute("autocomplete", mode === "signup" ? "new-password" : "current-password");
      messageEl.textContent = "";
      messageEl.className = "";
    }

    tabSignup.addEventListener("click", () => setMode("signup"));
    tabLogin.addEventListener("click", () => setMode("login"));

    function showMessage(text, isError) {
      messageEl.textContent = text;
      messageEl.className = isError ? "error" : "ok";
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        formCard.style.display = "none";
        statusCard.style.display = "block";
        statusContent.innerHTML =
          "Signed in as <strong>" + user.email + "</strong>" +
          (user.emailVerified ? "" : " — email not verified") +
          "<br><button class='signout' id='signout-btn'>Sign out</button>";

        document.getElementById("signout-btn").addEventListener("click", async () => {
          await auth.signOut();
        });
      } else {
        formCard.style.display = "block";
        statusCard.style.display = "none";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      submitBtn.disabled = true;
      messageEl.textContent = "";
      messageEl.className = "";

      try {
        if (mode === "signup") {
          await auth.createUserWithEmailAndPassword(email, password);
          showMessage("Account created successfully!", false);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
          showMessage("Signed in successfully!", false);
        }
      } catch (error) {
        showMessage(error.message, true);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
