<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Engineering Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #10182b;
    --line: #1f2a44;
    --ink: #eef1f7;
    --muted: #7c8aa8;
    --accent: #4c8dff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    border-bottom: 1px solid var(--line);
  }

  .logo {
    font-family: "Archivo", sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: var(--ink);
    text-decoration: none;
  }

  .logo span { color: var(--accent); }

  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 64px 20px 80px;
    text-align: center;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }

  h1 {
    font-family: "Archivo", sans-serif;
    font-weight: 900;
    font-size: 34px;
    margin: 0 0 32px;
    line-height: 1.15;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 28px;
    text-align: left;
    border-radius: 12px;
  }

  .tabs {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }

  .tabs button {
    background: none;
    border: none;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    padding: 0 0 8px;
    border-bottom: 2px solid transparent;
  }

  .tabs button.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    background: #0a0e1a;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 16px;
    font-family: inherit;
    border-radius: 8px;
  }

  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button[type="submit"] {
    width: 100%;
    background: var(--accent);
    color: #061024;
    border: none;
    padding: 11px 0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
  }

  button[type="submit"]:hover { opacity: 0.92; }

  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  #message {
    font-size: 13px;
    margin: -6px 0 14px;
    min-height: 16px;
  }

  #message.error { color: #ff6b6b; }
  #message.ok { color: #4cd98a; }

  .skip {
    display: block;
    margin-top: 20px;
    color: var(--muted);
    font-size: 14px;
    text-decoration: underline;
  }

  .skip:hover { color: var(--ink); }

  #status-card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 28px;
    font-size: 14px;
    color: var(--muted);
  }

  #status-card strong { color: var(--ink); }

  .signout {
    background: none;
    border: none;
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
    font-size: 13px;
    padding: 0;
    margin-top: 14px;
  }
</style>
</head>

<body>

    <a class="logo" href="home.html">Bibek <span>Dahal</span></a>

  <main>

        <button id="tab-signup" class="active">Sign up</button>

      </div>

      <form id="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          required 
          minlength="6"
          autocomplete="new-password">

        <p id="message"></p>

        <button type="submit" id="submit-btn">Sign up</button>
      </form>
    </div>

    <div id="status-card" class="card" style="display:none;"></div>

    <a class="skip" href="home.html">Continue without signing in</a>
  </main>
