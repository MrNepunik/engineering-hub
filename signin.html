<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Engineering Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #10182b;
    --line: #1f2a44;
    --ink: #eef1f7;
    --muted: #7c8aa8;
    --accent: #4c8dff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    border-bottom: 1px solid var(--line);
  }

  .logo {
    font-family: "Archivo", sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: var(--ink);
    text-decoration: none;
  }

  .logo span { color: var(--accent); }

  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    margin-left: 24px;
  }

  nav a:hover { color: var(--ink); }

  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 64px 20px 80px;
    text-align: center;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }

  h1 {
    font-family: "Archivo", sans-serif;
    font-weight: 900;
    font-size: 34px;
    margin: 0 0 32px;
    line-height: 1.15;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 28px;
    text-align: left;
  }

  .tabs {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }

  .tabs button {
    background: none;
    border: none;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    padding: 0 0 8px;
    border-bottom: 2px solid transparent;
  }

  .tabs button.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    background: #0a0e1a;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 16px;
    font-family: inherit;
  }

  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button[type="submit"] {
    width: 100%;
    background: var(--accent);
    color: #061024;
    border: none;
    padding: 11px 0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button[type="submit"]:hover { opacity: 0.92; }

  #message {
    font-size: 13px;
    margin: -6px 0 14px;
    min-height: 16px;
  }

  #message.error { color: #ff6b6b; }
  #message.ok { color: #4cd98a; }

  .skip {
    display: block;
    margin-top: 20px;
    color: var(--muted);
    font-size: 14px;
    text-decoration: underline;
  }

  .skip:hover { color: var(--ink); }

  #status-card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 28px;
    font-size: 14px;
    color: var(--muted);
  }

  #status-card strong { color: var(--ink); }

  .signout {
    background: none;
    border: none;
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
    font-size: 13px;
    padding: 0;
    margin-top: 14px;
  }
</style>
</head>
<body>

  <header>
    <a class="logo" href="https://mrnepunik.github.io/engineering-hub/">Bibek <span>Dahal</span></a>
  </header>

  <main>
    <div class="eyebrow">Account · Engineering Hub</div>
    <h1 id="heading">Sign in to comment</h1>

    <div id="form-card" class="card">
      <div class="tabs">
        <button id="tab-signup" class="active">Sign up</button>
        <button id="tab-login">Log in</button>
      </div>

      <form id="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6">

        <p id="message"></p>

        <button type="submit" id="submit-btn">Sign up</button>
      </form>
    </div>

    <div id="status-card" class="card" style="display:none;"></div>

    <a class="skip" href="https://mrnepunik.github.io/engineering-hub/">Continue without signing in</a>
  </main>

  <!--
    Fill in your Supabase project values below.
    Dashboard: Settings > API
  -->
  <script>
    const SUPABASE_URL = "https://wtwvqehliowvgyuratwr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_SXJvyyzUv8Ph3xzcF2mlhA_nDOZd5AS";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("auth-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submit-btn");
    const messageEl = document.getElementById("message");
    const formCard = document.getElementById("form-card");
    const statusCard = document.getElementById("status-card");
    const heading = document.getElementById("heading");
    const tabSignup = document.getElementById("tab-signup");
    const tabLogin = document.getElementById("tab-login");

    let mode = "signup";

    function setMode(newMode) {
      mode = newMode;
      tabSignup.classList.toggle("active", mode === "signup");
      tabLogin.classList.toggle("active", mode === "login");
      submitBtn.textContent = mode === "signup" ? "Sign up" : "Log in";
      messageEl.textContent = "";
      messageEl.className = "";
    }

    tabSignup.addEventListener("click", () => setMode("signup"));
    tabLogin.addEventListener("click", () => setMode("login"));

    function showMessage(text, isError) {
      messageEl.textContent = text;
      messageEl.className = isError ? "error" : "ok";
    }

    async function refreshStatus() {
      const { data: { session } } = await client.auth.getSession();

      if (session) {
        heading.textContent = "You're signed in";
        formCard.style.display = "none";
        statusCard.style.display = "block";
        statusCard.innerHTML =
          "Signed in as <strong>" + session.user.email + "</strong>" +
          (session.user.email_confirmed_at ? "" : " — email not yet confirmed") +
          "<br><button class=\"signout\" id=\"signout-btn\">Sign out</button>";
        document.getElementById("signout-btn").addEventListener("click", async () => {
          await client.auth.signOut();
          refreshStatus();
        });
      } else {
        heading.textContent = "Sign in to comment";
        formCard.style.display = "block";
        statusCard.style.display = "none";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (mode === "signup") {
        const { error } = await client.auth.signUp({ email, password });
        if (error) {
          showMessage(error.message, true);
        } else {
          showMessage("Check your email to confirm your account, then log in.", false);
        }
      } else {
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) {
          showMessage(error.message, true);
        } else {
          refreshStatus();
        }
      }
    });

    refreshStatus();
  </script>

</body>
</html>
